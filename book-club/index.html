/* Physical book, not a modal panel. */
.bookmodal{background:transparent;padding:0;box-shadow:none;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;overflow:hidden}

.toolbar,.controls,#status{display:none}
.stage{width:100%;height:100%;min-height:0;display:grid;place-items:center;perspective:1800px;overflow:visible;touch-action:pan-y}

.cardmini .cardid{margin-bottom:7%}.cardmini .field{border-bottom:1px solid var(--navy);margin-bottom:4%;padding-bottom:2%;overflow-wrap:anywhere}.cardmini .field b{display:inline;margin:0;font-size:.85em}
.cardmini table{border-collapse:collapse;table-layout:fixed;width:100%;margin-top:8%;font-size:inherit}.cardmini th,.cardmini td{border:0;border-bottom:1px solid var(--navy);border-right:1px solid var(--navy);padding:3% 1%;height:1.7em;text-align:center;overflow-wrap:anywhere}.cardmini th:last-child,.cardmini td:last-child{border-right:0}.cardmini th{font-family:Georgia;font-weight:bold;font-size:.85em;border-top:3px double var(--navy)}.cardmini th:nth-child(2){width:44%}.cardmini td:nth-child(2){font-family:'Segoe Print','Bradley Hand',cursive;font-style:italic}.cardmini button{font:inherit;border:0;background:none;color:var(--navy);padding:0;cursor:pointer}.cardmini .addrow{font-family:Arial;font-style:normal}

.signpop label{display:block;margin-top:12px}.signpop input:not([type=checkbox]){display:block;width:100%;border:0;border-bottom:1px solid var(--navy);background:none;padding:7px;color:var(--navy)}.signpop .closeform{float:right;border:0;background:none;color:var(--navy);font-size:20px}

/* Revision 3: paper edges, larger reading record, quiet typesetting. */

.opening-cover .coverinside{background:#f5eedc}
.sheet-side,.sheet-side.backside{background:#faf5e8}
.titlepage .dedication{font-family:Georgia,'Times New Roman',serif;font-style:italic;transform:none;color:var(--navy);font-size:clamp(10px,2.15vw,15px);line-height:1.45}

/* Revision 4: measured, independent spine zones and consistent cover type. */
.spine .s-author,.spine .s-title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;white-space:nowrap;overflow:hidden;line-height:1.16;letter-spacing:0;max-width:none;padding:0;margin:0}

.titlefit{left:10%;width:80%;top:38%;height:18%;line-height:1.12;letter-spacing:0}
